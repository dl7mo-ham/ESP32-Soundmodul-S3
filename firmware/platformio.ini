; Soundmodul Mini (Heltec V3 / ESP32-S3) - PlatformIO-Projekt
;
; Aufruf (im Ordner firmware/):
;   pio run              Firmware bauen
;   pio run -t upload    bauen und flashen
;   pio run -t uploadfs  Sounds aus data/ ins Flash (LittleFS)

[platformio]
default_envs = heltec_v3

[env:heltec_v3]
platform = espressif32 @ 6.9.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
; 8 MB Flash (ESP32-S3FN8): 2 x 2,5 MB App (OTA) + ca. 2,87 MB LittleFS fuer Sounds
board_upload.flash_size = 8MB
board_build.partitions = partitions_8mb.csv
board_build.filesystem = littlefs
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    ; Konsole ueber den nativen USB-Anschluss (CDC), UARTs bleiben frei
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    ; CRSF_ESP32 liegt als Kopie unter src/CRSF_ESP32/ und braucht keinen
    ; Eintrag. GPS (Port C, gps_speed.cpp) wird immer mitgebaut:
    plerup/EspSoftwareSerial @ 8.2.0
    mikalhart/TinyGPSPlus @ 1.1.0
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11

[env:s3_zero]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.filesystem = littlefs
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
board_build.arduino.memory_type = qio_qspi
lib_deps =
    plerup/EspSoftwareSerial @ 8.2.0
    mikalhart/TinyGPSPlus @ 1.1.0
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
