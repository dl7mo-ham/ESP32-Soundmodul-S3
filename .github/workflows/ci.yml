name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-firmware:
    name: Build firmware (Heltec V3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run

      # Eine einzige Datei zum Flashen ab Adresse 0x0 (Bootloader,
      # Partitionstabelle, OTA-Startdaten und Firmware zusammengefuegt),
      # z. B. mit https://espressif.github.io/esptool-js/
      - name: Merge flash image
        run: |
          pip install esptool==4.8.1
          B=.pio/build/heltec_v3
          esptool.py --chip esp32s3 merge_bin -o $B/sound-mini-heltec-v3-komplett.bin \
            --flash_mode keep --flash_freq keep --flash_size 8MB \
            0x0 $B/bootloader.bin \
            0x8000 $B/partitions.bin \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 $B/firmware.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: sound-mini-heltec-v3-firmware
          path: |
            firmware/.pio/build/heltec_v3/sound-mini-heltec-v3-komplett.bin
            firmware/.pio/build/heltec_v3/firmware.bin
